#
# tuned configuration
#

[main]
summary=Balanced profile for moeOS

[cpu]
governor=schedutil|powersave
energy_perf_bias=normal
energy_performance_preference=balance_performance|balance_power|power
boost=1
max_perf_pct=95

[acpi]
platform_profile=balanced|low-power

[audio]
timeout=5

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[sysctl]
kernel.sched_energy_aware=0
kernel.sched_util_clamp_max=1000

[service]
service.moeOS-nvboost-performance=stop