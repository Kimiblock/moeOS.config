#
# tuned configuration
#

[main]
summary=Optimize for low power consumption

[cpu]
governor=schedutil|powersave
energy_perf_bias=normal
energy_performance_preference=balance_power|power
boost=1
max_perf_pct=70

[acpi]
platform_profile=low-power|balanced|quiet

[eeepc_she]

[audio]
timeout=1

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[sysctl]
kernel.sched_energy_aware=1
kernel.sched_util_clamp_max=900

[service]
service.moeOS-nvboost-performance=stop